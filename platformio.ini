; PlatformIO Project Configuration for SE-24 CoCIS Smart System
; Multi-Target ESP-IDF Setup: ENTERANCE_MASTER, ROOM_NODE_1, ROOM_NODE_2

[platformio]
default_envs = ENTERANCE_MASTER

[env]
platform = espressif32 @ 6.5.0
framework = espidf
board = esp32dev
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder
board_build.cmake_extra_args = -DAPP_NODE=ENTERANCE_MASTER

; Target 1: ENTERANCE_MASTER - Entrance Terminal & Gateway (ESP32 #1)
[env:ENTERANCE_MASTER]
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -I components/common_protocol/include

; Target 2: ROOM_NODE_1 - Lecture Room 1 Terminal (ESP32 #2)
[env:ROOM_NODE_1]
board_build.cmake_extra_args = -DAPP_NODE=ROOM_NODE_1
build_flags = 
    -D ROOM_ID=1
    -D CORE_DEBUG_LEVEL=3
    -I components/common_protocol/include

; Target 3: ROOM_NODE_2 - Lecture Room 2 Terminal (ESP32 #3)
[env:ROOM_NODE_2]
board_build.cmake_extra_args = -DAPP_NODE=ROOM_NODE_2
build_flags = 
    -D ROOM_ID=2
    -D CORE_DEBUG_LEVEL=3
    -I components/common_protocol/include
