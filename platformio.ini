; PlatformIO Project Configuration File for SE-24 CoCIS Smart System
; Group: SE-24 (BSE III- Makerere University)
; Target: ESP32 DevKit V1 (ESP-IDF Framework)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = direct

build_flags = 
    -DCONFIG_LOG_DEFAULT_LEVEL=3
